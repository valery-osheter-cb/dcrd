name: Field64 Benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dcrec/secp256k1/field64_*'
      - '.github/workflows/field64_bench.yml'

permissions:
  contents: read

jobs:
  bench:
    name: Field64 amd64 benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25"
      - name: CPU info
        run: cat /proc/cpuinfo | head -30
      - name: Run Field64 amd64 tests
        working-directory: dcrec/secp256k1
        run: go test -tags '!purego' -run TestField64AMD64 -count=1 -v .
      - name: Run Field64 amd64 benchmarks
        working-directory: dcrec/secp256k1
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          go test -tags '!purego' -bench='BenchmarkField64(Mul|Square)AMD64' -benchmem -count=10 . | tee bench.txt
          echo '--- benchstat ---'
          benchstat bench.txt
      - name: Upload benchmark output
        uses: actions/upload-artifact@6f51c2450a5ee6272586270642e9b496bc808c5c # v4.6.0
        with:
          name: field64-bench
          path: dcrec/secp256k1/bench.txt
